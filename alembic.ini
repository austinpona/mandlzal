# Alembic configuration. The actual sqlalchemy.url is sourced from the
# application settings (env var DATABASE_URL) inside `alembic/env.py`, so
# the placeholder below is intentional - keep it.
[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname
prepend_sys_path = .
version_path_separator = os
# Naming convention to keep auto-generated revision filenames readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# (optional) hooks for formatting generated migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
